<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061327"><title>QAYO ZƏNCİR 001</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#061327;color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}h1{font-size:20px;letter-spacing:.06em;margin:8px 0 4px}h2{font-size:13px;letter-spacing:.12em;color:#7fc4ff;margin:22px 0 8px}p{margin:0;color:#b9c8dd;font-size:14px}.bar{margin:12px 0;padding:12px 14px;border-radius:12px;font-weight:700;font-size:15px}.bar.no{background:#3a1520;border:1px solid #e63946}.bar.ok{background:#0f3322;border:1px solid #2ecc71}.card{background:#0b2040;border:1px solid #1f3a66;border-radius:14px;padding:12px 14px;margin:10px 0}.top{display:flex;gap:10px;align-items:center}.n{width:30px;height:30px;border-radius:50%;background:#e63946;display:grid;place-items:center;font-weight:800;flex:none}.nm{font-weight:700;font-size:16px;min-width:0;overflow-wrap:anywhere}.kd{font-size:12px;color:#8fa6c6}.sw{display:flex;gap:6px;margin:8px 0;align-items:center;font-size:12px;color:#b9c8dd}.sw i{display:inline-block;width:18px;height:18px;border-radius:5px;border:1px solid #ffffff55}.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;margin:2px 4px 2px 0}.g{background:#0f3322;color:#7be3a4}.r{background:#3a1520;color:#ff8f99}.y{background:#3a2e10;color:#ffd27a}a{color:#7fc4ff;overflow-wrap:anywhere}ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:#ffb3ba}.rl{font-size:13px;color:#b9c8dd;padding-left:18px}.rl li{margin:4px 0}</style></head><body><h1>QAYO ZƏNCİR 001</h1><p>7 halqa: səs, fon, rəng, keçid. Tələblər bir yerdə.</p><div id="bar"></div><h2>ÜMUMİ (bütün zəncir üçün)</h2><div id="gl"></div><h2>HALQALAR</h2><div id="ls"></div><h2>QAYDALAR</h2><ol class="rl" id="rl"></ol><script>function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
fetch('/api/chain').then(function(r){return r.json()}).then(function(d){
document.getElementById('bar').innerHTML='<div class="bar '+(d.ready?'ok':'no')+'">'+(d.ready?'Zəncir göndərməyə hazırdır':'Hazır deyil: '+d.open_items+' çatışmazlıq')+'</div>';
document.getElementById('gl').innerHTML=d.global.map(function(g){return '<div class="card"><b>'+e(g.key)+'</b> <span class="chip '+(g.missing?'r':'g')+'">'+(g.missing?'boşdur':'var')+'</span><p>'+e(g.value||g.note)+'</p></div>'}).join('');
document.getElementById('ls').innerHTML=d.links.map(function(l){var st=l.asset_status==='hazır'?'g':(l.asset_status==='qaralama'?'y':'r');return '<div class="card"><div class="top"><div class="n">'+l.pos+'</div><div><div class="nm">'+e(l.name)+'</div><div class="kd">'+e(l.kind)+(l.link?' · <a href="'+e(l.link)+'" target="_blank" rel="noopener">link</a>':'')+'</div></div></div><div class="sw"><span class="chip '+st+'">'+e(l.asset_status)+'</span><i style="background:'+e(l.bg_color||'transparent')+'"></i>'+e(l.bg_color||'fon yoxdur')+'<i style="background:'+e(l.accent_color||'transparent')+'"></i>'+e(l.accent_color||'vurğu yoxdur')+'</div>'+(l.note?'<p>'+e(l.note)+'</p>':'')+(l.missing.length?'<ul>'+l.missing.map(function(m){return '<li>'+e(m)+'</li>'}).join('')+'</ul>':'')+'</div>'}).join('');
document.getElementById('rl').innerHTML=d.rules.map(function(r){return '<li>'+e(r)+'</li>'}).join('');
}).catch(function(){document.getElementById('bar').innerHTML='<div class="bar no">Yüklənmədi</div>'});</script></body></html>
