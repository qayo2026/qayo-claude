<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QAYO İNŞAAT — giriş videosu</title>
<style>
/* Bu səhifə tam təcrid olunub: saytın kataloqundakı heç bir CSS/JS buraya təsir etmir. */
html,body{margin:0;height:100%;background:#00152e;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#00152e}
button{position:fixed;border:1px solid rgba(255,255,255,.55);border-radius:22px;padding:10px 16px;min-height:44px;font:800 14px/1 Arial,sans-serif;color:#fff;background:rgba(0,21,46,.72);cursor:pointer}
.skip{top:max(6px,env(safe-area-inset-top));right:8px;padding:6px 10px;min-height:30px;font-size:11px;border-radius:16px;letter-spacing:.2px;background:#e30613;border-color:rgba(255,255,255,.85)}
button:focus-visible{outline:3px solid #f7c532;outline-offset:2px}
</style></head><body>
<video id="v" playsinline webkit-playsinline muted preload="auto" poster="/qayo-intro-video/poster.jpg" aria-label="QAYO İNŞAAT Azərbaycan"><source src="/qayo-intro-video/qayo-insaat-azerbaycan-web.mp4" type="video/mp4"></video>
<button type="button" class="skip" id="skip">ONLAYN SATIŞ →</button>
<script>
(function(){
var v=document.getElementById("v");
function say(m){try{parent.postMessage({qayoIntro:m},location.origin)}catch(_){}}
document.getElementById("skip").addEventListener("click",function(){say("done")});
/* Düymə yoxdur: video dərhal başlayır. Brauzer səsə icazə verməsə, səssiz başlayır və ekrana ilk toxunuşda səs açılır. */
function unmute(){if(!v.muted)return;v.muted=false;v.volume=1;try{var q=v.play();if(q&&q.catch)q.catch(function(){v.muted=true})}catch(_){}}
["pointerdown","touchstart","click","keydown"].forEach(function(t){document.addEventListener(t,function(e){if(e.target&&e.target.id==="skip")return;unmute()},{passive:true})});
v.addEventListener("playing",function(){say("started")});
v.addEventListener("ended",function(){say("done")});
v.addEventListener("error",function(){say("done")});
document.addEventListener("keydown",function(e){if(e.key==="Escape")say("done")});
say("ready");
v.muted=false;
try{var p=v.play();if(p&&p.catch)p.catch(function(){v.muted=true;try{v.play()}catch(_){}})}catch(_){v.muted=true;try{v.play()}catch(_){}}
})();
</script></body></html>
